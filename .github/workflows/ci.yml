name: CI

on:
  push:
    branches: [ main, master, gpu]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff==0.15.10 coverage

    - name: Check code formatting
      run: |
        ruff format --check .

    - name: Lint with ruff
      run: |
        ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libboost-all-dev libopenmpi-dev \
          libnetcdf-dev libhdf5-dev libnetcdf-c++4-dev libgsl-dev \
          nlohmann-json3-dev pkg-config

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install netCDF4
        pip install -e ".[dev]"
        pip install coverage
      env:
        NETCDF_DIR: /usr
        HDF5_DIR: /usr
        GSL_DIR: /usr

    - name: Run tests
      run: |
        python -m coverage run -m unittest discover tests/
        python -m coverage xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake ninja-build libboost-all-dev libopenmpi-dev \
          libnetcdf-dev libhdf5-dev libnetcdf-c++4-dev libgsl-dev \
          nlohmann-json3-dev pkg-config

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install netCDF4
        pip install -e ".[dev]"
      env:
        NETCDF_DIR: /usr
        HDF5_DIR: /usr
        GSL_DIR: /usr

    - name: Run examples
      run: |
        (cd examples/equilibrium_chaos_map && python phase_space_map.py)
        (cd examples/fusion_distribution && python fusion_distribution.py)
        (cd examples/fusion_distribution_perturbed && python fusion_distribution_perturbed.py)
        (cd examples/uniform_surf_distribution && python uniform_surf_distribution.py)
        (cd examples/uniform_vol_distribution && python uniform_vol_distribution.py)
        (cd examples/plot_trajectory && python plot_trajectory.py)
        (cd examples/orbit_classification && python fusion_distribution_classification.py)
        (cd examples/passing_map_unperturbed && python passing_map.py)
        (cd examples/perturbed_chaos_map && python heat_map_alone.py)
        (cd examples/passing_map_perturbed_QA && python passing_map_perturbed.py)
        (cd examples/passing_map_perturbed_QH && python passing_map_perturbed.py)
        (cd examples/trapped_map && python trapped_map.py)
        (cd examples/trapped_map_QI && python trapped_map_QI.py)
        (cd examples/passing_frequencies && python passing_frequencies.py)
        (cd examples/trapped_frequencies && python trapped_frequencies.py)
        (cd examples/tracing_with_AE && python tracing_with_AE.py)
        (cd examples/tracing_with_FAR3D_IVP && python tracing_with_FAR3D_AE.py)
        (cd examples/WBA_particles && python WBA_tracing_boozer.py && python WBA_tracing_perturbed.py)

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libboost-all-dev libopenmpi-dev \
          libnetcdf-dev libhdf5-dev libnetcdf-c++4-dev libgsl-dev \
          nlohmann-json3-dev pkg-config

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install netCDF4
        pip install -e .
        pip install -r docs/requirements.txt
      env:
        NETCDF_DIR: /usr
        HDF5_DIR: /usr
        GSL_DIR: /usr

    - name: Build documentation
      run: |
        cd docs
        make html
